name: Social Post

on:
  schedule:
    # **저녁 것은 일부러 이르게 잡는다.**
    #
    # GitHub 이 예약을 띄우는 시각이 한두 시간, 심하면 네다섯 시간 늦는다.
    # 2026-09-15 에는 21:13 대기열 글이 다음 날 01:54 에 나갔다. 새벽 두 시에
    # 올라간 글은 아무도 안 본다. 크론 분을 정시에서 비껴 봤지만(09-15)
    # 지연은 그대로였다. 옮겨서 고칠 수 있는 문제가 아니다.
    #
    # 그래서 밀릴 것을 셈에 넣고 시각을 당긴다. 19:40 이면 네 시간이 밀려도
    # 자정 전이다. 늦게 나가는 것과 새벽에 나가는 것은 다르다.
    # 스크리닝 파이프라인이 모두 끝난 뒤, 평일 KST 18:40 (UTC 09:40)
    # fetch-prices 16:33 → exit-signals 16:47 → screener 17:07 → momentum 그 뒤 → social 18:40
    # 이 실행은 --auto라서 스크리너 자동 글만 올린다.
    - cron: "40 9 * * 1-5"
    # 평일 KST 19:40 (UTC 10:40). --queue-only라서 content/posts.yml에
    # 올릴 글이 남아 있을 때만 발행하고, 큐가 비면 아무것도 하지 않는다.
    # 수동 큐는 자동 글보다 먼저 쓰이기 때문에, 한 실행에서 둘 다 뽑을
    # 수는 없어 이렇게 시간을 갈라 둘 다 매일 나가게 한다.
    # 18:40 자동 글과 145분 벌려 둔다. 같은 워크플로의 두 슬롯이 두 시간
    # 안에 붙어 있으면 GitHub 이 하나를 버린다(실측 최소 간격 113~122분).
    # 60분 간격이던 때는 저녁 두 글 중 하나가 늘 안 떴다.
    - cron: "5 12 * * 1-5"
    # 평일 KST 16:08 (UTC 07:08). 국장 마감 요약.
    # 장은 15:30에 끝나고 fetch-prices가 15:55까지 돌므로 숫자가 확정돼 있다.
    - cron: "8 7 * * 1-5"
    # 평일 KST 08:09 (UTC 23:09, 전날). 미장 브리핑.
    # us-screener가 UTC 22:07(KST 07:07)에 도니 한 시간 뒤다.
    # 국장 개장(09:00) 전에 나가야 해서 08:09로 잡았다.
    # UTC 일요일 23:09 = KST 월요일 08:09라 요일이 0-4다.
    - cron: "9 23 * * 0-4"
    # 토·일 KST 16:08 (UTC 07:08). 대기열 글.
    #
    # 쓰레드 인사이트의 "가장 활동이 많은 시간" 상위 세 자리가 전부
    # 오후 3~6시였고 요일은 일·금·토였다. 그런데 크론이 전부 평일(1-5)이라
    # 그 자리를 통째로 비워 두고 있었다. 주말은 장이 안 서서 자동 글이
    # 없으므로 대기열 글을 내보낸다.
    - cron: "8 7 * * 6,0"
    # 금요일 전용 슬롯은 두지 않는다.
    #
    # 예전에는 17:18 에 하나 걸어 두었다. 그런데 금요일은 위 평일 슬롯
    # (1-5)에 이미 들어 있어서 16:08·18:40·21:05 를 그대로 받는다. 거기에
    # 17:18 을 더하면 16:08 과 70분, 18:40 과 82분이 되어 두 시간 규칙을
    # 어긴다. GitHub 은 두 시간 안에 붙은 슬롯을 하나만 띄우므로, 더해서
    # 얻는 것 없이 금요일만 어느 것이 뜰지 모르게 된다.
    #
    # 금요일 17:18 발행은 Worker 가 맡는다(workers/post-scheduler).

  # Cloudflare Worker 가 정확한 시각에 쏘는 신호.
  #
  # 위 크론은 남겨 둔다. Worker 가 멎어도 글은 나가야 하기 때문이다.
  # 둘 다 떠도 아래 시간 창과 하루 한 번 잠금이 겹치는 것을 막는다.
  repository_dispatch:
    types: [post]

  workflow_dispatch:
    inputs:
      dry_run:
        description: "실제 발행 없이 본문만 확인"
        type: boolean
        default: false
      source:
        # 기본값은 대기열이다. 자동 글은 평일 19:00 크론이 알아서 내보내므로,
        # 사람이 버튼을 누르는 상황은 거의 언제나 "지금 당장 대기열 글을
        # 내보내고 싶다"는 뜻이다. 기본값이 자동 글이던 때, 드롭다운을 그대로
        # 두고 누르는 바람에 올리려던 안내 글 대신 종목 글이 두 번 나갔다.
        description: "무엇을 올릴지"
        type: choice
        default: "대기열 글 (posts.yml)"
        options:
          - "대기열 글 (posts.yml)"
          - "자동 글 (스크리너)"
          - "국장 마감 (16:00)"
          - "미장 브리핑 (08:00)"
      only:
        description: "한 플랫폼에만 발행 (테스트용)"
        type: choice
        default: "설정대로"
        options:
          - "설정대로"
          - threads
          - instagram
      force:
        description: "하루 1건 상한 무시 (테스트용)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: social-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        # beautifulsoup4는 시황 글의 기사 제목 수집에 쓴다
        # requirements.txt 를 같이 깐다. 여기에 목록을 따로 적어 두었더니
        # screener 가 pytz 를 쓰기 시작했을 때 이 워크플로만 빠졌다.
        # 미장 브리핑은 us_screener → screener 를 불러오므로 매일 아침
        # ModuleNotFoundError 로 죽었다. 다른 모드는 멀쩡해서 오래 몰랐다.
        run: pip install -r requirements.txt pyyaml pillow

      - name: Install Korean fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum

      # 무엇을 올릴지 정하고 인스타용 카드 PNG를 만든다.
      # 연결되지 않은 플랫폼을 걸러내야 해서 여기서도 자격증명을 읽는다.
      - name: Prepare post
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DISPATCH_MODE: ${{ github.event.client_payload.mode }}
          DISPATCH_WINDOW: ${{ github.event.client_payload.window }}
        # 예약 실행은 cron으로, 수동 실행은 source 입력으로 갈린다.
        # 예약이면 schedule이 차 있고 inputs.source가 비어서 아래 case를
        # 그냥 지나간다. 수동이면 그 반대라 source가 모드를 정한다.
        run: |
          # WINDOW 는 "이 시각대를 벗어나 뜬 실행은 올리지 말라"는 뜻이다.
          # 예약이 밀려 새벽에 떠도 글이 새벽에 나가지 않는다.
          WINDOW=""
          # Worker 가 보낸 값. 밖에서 들어오는 값이라 명령줄에 바로 끼워
          # 넣지 않고, 아는 이름인지 확인한 뒤에 쓴다.
          case "$DISPATCH_MODE" in
            queue)    MODE="--queue-only" ;;
            auto)     MODE="--auto" ;;
            kr_close) MODE="--brief=kr_close" ;;
            us_brief) MODE="--brief=us_brief" ;;
            "")       ;;
            *) echo "모르는 모드: $DISPATCH_MODE"; exit 1 ;;
          esac
          if [ -n "$DISPATCH_MODE" ]; then
            # 창은 "HH:MM-HH:MM" 만 받는다.
            if echo "$DISPATCH_WINDOW" | grep -Eq '^[0-2][0-9]:[0-5][0-9]-[0-2][0-9]:[0-5][0-9]$'; then
              WINDOW="$DISPATCH_WINDOW"
            else
              echo "창 형식이 이상해 무시합니다: $DISPATCH_WINDOW"
            fi
          fi
          # 크론으로 뜬 것만 여기서 모드를 정한다. Worker 신호로 들어오면
          # github.event.schedule 이 비어 있어 *) 에 걸리고, 그러면 위에서
          # 정한 모드가 --auto 로 덮어써진다.
          if [ -z "$DISPATCH_MODE" ]; then
          case "${{ github.event.schedule }}" in
            "8 7 * * 1-5")   MODE="--brief=kr_close"; WINDOW="15:45-19:00" ;;
            "9 23 * * 0-4")  MODE="--brief=us_brief"; WINDOW="07:30-10:30" ;;
            "5 12 * * 1-5")  MODE="--queue-only";     WINDOW="17:00-22:30" ;;
            "8 7 * * 6,0")   MODE="--queue-only";     WINDOW="15:00-22:30" ;;
            "18 8 * * 5")    MODE="--queue-only";     WINDOW="17:00-22:30" ;;
            *)               MODE="--auto";           WINDOW="17:00-22:30" ;;
          esac
          fi
          # 사람이 버튼을 누른 실행은 창을 보지 않는다. 지금 올리려고 누른 것이다.
          case "${{ inputs.source }}" in
            "대기열 글 (posts.yml)") MODE="--queue-only"; WINDOW="" ;;
            "국장 마감 (16:00)")     MODE="--brief=kr_close"; WINDOW="" ;;
            "미장 브리핑 (08:00)")   MODE="--brief=us_brief"; WINDOW="" ;;
            "자동 글 (스크리너)")    MODE="--auto"; WINDOW="" ;;
          esac
          echo "모드: $MODE  창: ${WINDOW:-없음}"
          python scripts/social_post.py prepare "$MODE" \
            ${WINDOW:+--window=$WINDOW} \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.force && '--force' || '' }} \
            ${{ (inputs.only != '' && inputs.only != '설정대로') && format('--only={0}', inputs.only) || '' }}

      # 인스타는 외부에서 열리는 이미지 URL이 필요하다.
      # 카드를 먼저 push해서 GitHub Pages가 서빙하게 만든다.
      - name: Push card image
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 경로를 하나씩 add 한다. 한꺼번에 넘기면 없는 경로 하나 때문에
          # git add 전체가 실패해 아무것도 스테이징되지 않는다.
          for p in assets/cards; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "No card change"
            exit 0
          fi
          git commit -m "chore: social card [auto]"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort; git pull --rebase=true -X theirs origin main; }
            sleep 2
          done
          exit 1

      - name: Publish
        if: ${{ !inputs.dry_run }}
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/social_post.py publish

      - name: Commit state
        if: ${{ always() && !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 경로를 하나씩 add 한다. 한꺼번에 넘기면 없는 경로 하나 때문에
          # git add 전체가 실패해 상태 파일이 커밋되지 않는다.
          for p in data/social assets/cards; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: social post state [auto]"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort; git pull --rebase=true -X theirs origin main; }
            sleep 2
          done
          exit 1
