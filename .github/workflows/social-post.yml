name: Social Post

on:
  schedule:
    # 스크리닝 파이프라인이 모두 끝난 뒤, 평일 KST 19:00 (UTC 10:00)
    # fetch-prices 16:30 → exit-signals 16:45 → screener 17:00 → momentum 17:30 → social 19:00
    # 이 실행은 --auto라서 스크리너 자동 글만 올린다.
    - cron: "0 10 * * 1-5"
    # 평일 KST 21:00 (UTC 12:00). --queue-only라서 content/posts.yml에
    # 올릴 글이 남아 있을 때만 발행하고, 큐가 비면 아무것도 하지 않는다.
    # 수동 큐는 자동 글보다 먼저 쓰이기 때문에, 한 실행에서 둘 다 뽑을
    # 수는 없어 이렇게 시간을 갈라 둘 다 매일 나가게 한다.
    - cron: "0 12 * * 1-5"
    # 평일 KST 16:00 (UTC 07:00). 국장 마감 요약.
    # 장은 15:30에 끝나고 fetch-prices가 15:55까지 돌므로 숫자가 확정돼 있다.
    - cron: "0 7 * * 1-5"
    # 평일 KST 08:00 (UTC 23:00, 전날). 미장 브리핑.
    # us-screener가 UTC 22:00(KST 07:00)에 도니 한 시간 뒤다.
    # 국장 개장(09:00) 전에 나가야 해서 08:00으로 잡았다.
    # UTC 일요일 23:00 = KST 월요일 08:00이라 요일이 0-4다.
    - cron: "0 23 * * 0-4"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "실제 발행 없이 본문만 확인"
        type: boolean
        default: false
      source:
        description: "무엇을 올릴지"
        type: choice
        default: "자동 글 (스크리너)"
        options:
          - "자동 글 (스크리너)"
          - "대기열 글 (posts.yml)"
          - "국장 마감 (16:00)"
          - "미장 브리핑 (08:00)"
      only:
        description: "한 플랫폼에만 발행 (테스트용)"
        type: choice
        default: "설정대로"
        options:
          - "설정대로"
          - threads
          - instagram
      force:
        description: "하루 1건 상한 무시 (테스트용)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: social-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        # beautifulsoup4는 시황 글의 기사 제목 수집에 쓴다
        run: pip install requests pyyaml pillow beautifulsoup4

      - name: Install Korean fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum

      # 무엇을 올릴지 정하고 인스타용 카드 PNG를 만든다.
      # 연결되지 않은 플랫폼을 걸러내야 해서 여기서도 자격증명을 읽는다.
      - name: Prepare post
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        # 예약 실행은 cron으로, 수동 실행은 source 입력으로 갈린다.
        # 예약이면 schedule이 차 있고 inputs.source가 비어서 아래 case를
        # 그냥 지나간다. 수동이면 그 반대라 source가 모드를 정한다.
        run: |
          case "${{ github.event.schedule }}" in
            "0 7 * * 1-5")  MODE="--brief=kr_close" ;;
            "0 23 * * 0-4") MODE="--brief=us_brief" ;;
            "0 12 * * 1-5") MODE="--queue-only" ;;
            *)              MODE="--auto" ;;
          esac
          case "${{ inputs.source }}" in
            "대기열 글 (posts.yml)") MODE="--queue-only" ;;
            "국장 마감 (16:00)")     MODE="--brief=kr_close" ;;
            "미장 브리핑 (08:00)")   MODE="--brief=us_brief" ;;
            "자동 글 (스크리너)")    MODE="--auto" ;;
          esac
          echo "모드: $MODE"
          python scripts/social_post.py prepare "$MODE" \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.force && '--force' || '' }} \
            ${{ (inputs.only != '' && inputs.only != '설정대로') && format('--only={0}', inputs.only) || '' }}

      # 인스타는 외부에서 열리는 이미지 URL이 필요하다.
      # 카드를 먼저 push해서 GitHub Pages가 서빙하게 만든다.
      - name: Push card image
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 경로를 하나씩 add 한다. 한꺼번에 넘기면 없는 경로 하나 때문에
          # git add 전체가 실패해 아무것도 스테이징되지 않는다.
          for p in assets/cards; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "No card change"
            exit 0
          fi
          git commit -m "chore: social card [auto]"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort; git pull --rebase=true -X theirs origin main; }
            sleep 2
          done
          exit 1

      - name: Publish
        if: ${{ !inputs.dry_run }}
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/social_post.py publish

      - name: Commit state
        if: ${{ always() && !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 경로를 하나씩 add 한다. 한꺼번에 넘기면 없는 경로 하나 때문에
          # git add 전체가 실패해 상태 파일이 커밋되지 않는다.
          for p in data/social assets/cards; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: social post state [auto]"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort; git pull --rebase=true -X theirs origin main; }
            sleep 2
          done
          exit 1
