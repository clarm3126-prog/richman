name: Social Insights

on:
  schedule:
    # 매일 KST 22:00 (UTC 13:00). 19:00 자동 글과 21:00 대기열 글이
    # 모두 나간 뒤라 그날 올린 글도 같이 잡힌다.
    - cron: "0 13 * * *"
    # 월요일 KST 09:00 (UTC 0:00). 수집한 뒤 텔레그램으로 요약을 보낸다.
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      report:
        description: "텔레그램으로 요약 보내기"
        type: boolean
        default: true
      dry_run:
        description: "저장 없이 출력만"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: social-insights
  cancel-in-progress: false

jobs:
  insights:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install requests pyyaml

      # 조회수는 시간이 지나며 늘어나므로 최근 글을 매일 다시 물어보고 덮어쓴다.
      - name: Collect insights
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/social_insights.py \
            ${{ (github.event.schedule == '0 0 * * 1' || inputs.report) && '--report' || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit insights
        if: ${{ always() && !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -e data/social ]; then git add data/social; fi
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: social insights [auto]"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort; git pull --rebase=true -X theirs origin main; }
            sleep 2
          done
          exit 1
