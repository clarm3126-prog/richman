name: Social Engage

on:
  schedule:
    # 고정 시각 다섯 번. KST 09:13 · 12:13 · 15:13 · 18:13 · 21:13.
    #
    # 예전에는 */15 였다. 하루 96번 예약인데 **실제로는 5~7번만 돌았다.**
    # 9월 기록을 세어 보니 그렇다. GitHub 은 잦은 예약의 간격을 지키지 않고
    # 두세 시간에 한 번씩 던진다. 그래서 01:39 · 04:50 처럼 아무도 댓글을
    # 안 다는 시각에 돌고, 정작 사람이 몰리는 저녁은 비었다.
    #
    # 횟수는 그대로 다섯 번인데 시각이 쓸모 있는 자리로 온다. 고정 시각
    # 예약은 이 저장소에서 하루 한 번씩 제대로 돌고 있다.
    - cron: "13 0 * * *"
    - cron: "13 3 * * *"
    - cron: "13 6 * * *"
    - cron: "13 9 * * *"
    - cron: "13 12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "실제 발송 없이 무엇을 보낼지만 확인"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: social-engage
  cancel-in-progress: false

jobs:
  engage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Reply to comments and send link DMs
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/social_engage.py ${{ inputs.dry_run && '--dry-run' || '' }}

      # 처리한 댓글 ID만 기록한다. 작성자나 본문은 저장하지 않는다.
      - name: Commit handled state
        if: ${{ always() && !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 경로를 하나씩 add 한다. 한꺼번에 넘기거나 없는 경로를 넘기면
          # git add 전체가 실패해 상태 파일이 커밋되지 않는다.
          for p in data/social; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: social engage state [auto]"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort; git pull --rebase=true -X theirs origin main; }
            sleep 2
          done
          exit 1
