name: Social Engage

on:
  schedule:
    # 고정 시각 여섯 번. 발행 시각 뒤에 오도록 놓았다.
    #
    # 예전에는 */15 였다. 하루 96번 예약인데 실제로는 5~7번만 돌았고, 그것도
    # 01:39 · 04:50 처럼 아무도 댓글을 안 다는 시각이었다. GitHub 은 두 시간
    # 안에 붙은 슬롯을 하나만 띄운다.
    #
    # 고정으로 바꾼 뒤에도 자리가 틀렸다. 21:13 이 다음 실행이라, **19:40 에
    # 나간 글의 댓글을 창이 닫히고 63분 뒤에야 알게 됐다.** 쓰레드는 올린 뒤
    # 15~30분 반응으로 확산을 정하는데, 그 창 밖에서 알면 소용이 없다.
    #
    # 20:05 가 핵심이다. 18:40 자동 글과 19:40 대기열 글의 초기 댓글을 한 번에
    # 걷고, 창(19:40~20:10)이 닫히기 5분 전에 알린다.
    - cron: "5 0 * * *"      # KST 09:05  미장 브리핑(08:09) 뒤
    - cron: "30 2 * * *"     # KST 11:30
    - cron: "0 5 * * *"      # KST 14:00
    - cron: "0 8 * * *"      # KST 17:00  국장 마감(16:08) 뒤
    - cron: "5 11 * * *"     # KST 20:05  ⭐ 저녁 두 글의 30분 창 안
    - cron: "30 13 * * *"    # KST 22:30  하루 마무리
  workflow_dispatch:
    inputs:
      dry_run:
        description: "실제 발송 없이 무엇을 보낼지만 확인"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: social-engage
  cancel-in-progress: false

jobs:
  engage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Reply to comments and send link DMs
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/social_engage.py ${{ inputs.dry_run && '--dry-run' || '' }}

      # 처리한 댓글 ID만 기록한다. 작성자나 본문은 저장하지 않는다.
      - name: Commit handled state
        if: ${{ always() && !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 경로를 하나씩 add 한다. 한꺼번에 넘기거나 없는 경로를 넘기면
          # git add 전체가 실패해 상태 파일이 커밋되지 않는다.
          for p in data/social; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: social engage state [auto]"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort; git pull --rebase=true -X theirs origin main; }
            sleep 2
          done
          exit 1
