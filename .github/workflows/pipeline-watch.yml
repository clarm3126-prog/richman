name: Pipeline Watch

# 오늘 돌았어야 할 것이 안 돌았으면 텔레그램으로 알린다.
#
# GitHub 이 예약 실행을 버려도 아무 신호가 없다. 실패하면 메일이 오지만
# 아예 안 돌면 조용해서, 데이터 날짜를 사람이 열어봐야 알 수 있었다.
#
# **이 감시도 예약 실행이라 같이 빠질 수 있다.** 그래서 세 번 걸어 두고
# 같은 내용은 하루 한 번만 보낸다. 셋 중 하나만 떠도 알림은 간다.
#
# 시각은 하루 네 번째 글(KST 21:00)이 나간 뒤로 잡는다. 그 전에 재면
# 아직 안 나간 글까지 빠졌다고 알린다.
on:
  schedule:
    - cron: "30 12 * * 1-5"   # KST 21:30
    - cron: "30 13 * * 1-5"   # KST 22:30
    - cron: "30 14 * * 1-5"   # KST 23:30
  workflow_dispatch:
    inputs:
      dry_run:
        description: "보내지 않고 본문만 확인"
        type: boolean
        default: false

# 세 크론이 겹쳐 돌면 같은 상태 파일을 동시에 밀어 커밋이 충돌한다.
concurrency:
  group: pipeline-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/pipeline_watch.py \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -e data/watchdog_state.json ]; then git add data/watchdog_state.json; fi
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: pipeline watch state [auto]"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort; git pull --rebase=true -X theirs origin main; }
            sleep 2
          done
          exit 1
