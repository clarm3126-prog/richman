name: User Alerts

on:
  schedule:
    # ⚠️ `*/5 0-7` 로 걸어 뒀더니 **장중에 거의 안 돌았다.** 9월 기록을 보면
    #    실제 실행이 19:11 · 22:45 · 23:57 처럼 밤에 몰려 있다. 목표가 알림이
    #    장 끝나고 여섯 시간 뒤에 가고 있었다는 뜻이다.
    #    고빈도 예약은 깃허브가 버리므로 시각을 박아 둔다.
    #
    # ⚠️ **같은 워크플로의 슬롯은 두 시간 이상 벌린다.** 두 시간 안에 붙여 두면
    #    둘 중 하나만 뜬다. 처음엔 45분 간격으로 열 개를 깔았는데, 그러면 열 개를
    #    깔아도 서넛만 뜨고 어느 게 뜰지도 모른다. **네 개가 열 개보다 자주 뜬다.**
    #    (12317 실측 — User Alerts 연속 실행 최소 간격 122분. 내 커밋 기록으로도 97분)
    #
    # 장중 2시간 간격 (UTC = KST - 9)
    - cron: "15 0 * * 1-5"    # KST 09:15
    - cron: "15 2 * * 1-5"    # KST 11:15
    - cron: "15 4 * * 1-5"    # KST 13:15
    - cron: "35 6 * * 1-5"    # KST 15:35  정규장 마감 직후 (13:15 과 140분)
    #
    # 장외는 **계정 연결 처리**가 목적이라 하루 세 번이면 된다.
    # 예전에는 `9 8-23 * * *` 로 열여섯 슬롯이었는데, 실행이 슬롯 수를 대체로
    # 따라가는 탓에 **장외가 장중 몫을 먹고 있었다.**
    #   8일 실측 — 장중 9회 / 장외 32회 (예정 비율 32%/68%, 실제 22%/78%)
    #   → 목표가 알림이 19:11 · 22:45 · 23:57 에 나가던 게 이것 때문이다.
    #     밤 슬롯이 실제로 도는 거의 유일한 슬롯이었다.
    #   17:09 은 15:35 와 94분이라 두 시간이 안 된다. 17:40 으로 민다.
    - cron: "40 8 * * *"      # KST 17:40  (15:35 와 125분)
    - cron: "9 12 * * *"      # KST 21:09  (17:40 과 209분)
    - cron: "9 22 * * *"      # KST 07:09  (21:09 과 600분, 09:15 와 126분)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: user-alerts
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install requests

      - name: Link telegram accounts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/telegram_link.py

      - name: Send user alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/user_alerts.py

      - name: Commit offset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/telegram_offset.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: telegram offset [auto]"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort; git pull --rebase=true -X theirs origin main; }
            sleep 2
          done
          exit 1
