name: User Alerts

on:
  schedule:
    # ⚠️ `*/5 0-7` 로 걸어 뒀더니 **장중에 거의 안 돌았다.** 9월 기록을 보면
    #    실제 실행이 19:11 · 22:45 · 23:57 처럼 밤에 몰려 있다. 목표가 알림이
    #    장 끝나고 여섯 시간 뒤에 가고 있었다는 뜻이다.
    #    고빈도 예약은 깃허브가 버리므로 시각을 박아 둔다.
    #
    # 장중 45분 간격 (UTC = KST - 9)
    - cron: "15 0 * * 1-5"    # KST 09:15
    - cron: "0 1 * * 1-5"     # KST 10:00
    - cron: "45 1 * * 1-5"    # KST 10:45
    - cron: "30 2 * * 1-5"    # KST 11:30
    - cron: "15 3 * * 1-5"    # KST 12:15
    - cron: "0 4 * * 1-5"     # KST 13:00
    - cron: "45 4 * * 1-5"    # KST 13:45
    - cron: "30 5 * * 1-5"    # KST 14:30
    - cron: "15 6 * * 1-5"    # KST 15:15
    - cron: "40 6 * * 1-5"    # KST 15:40  정규장 마감 직후
    # 장외 시간에도 계정 연결은 처리되도록 1시간마다
    - cron: "9 8-23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: user-alerts
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install requests

      - name: Link telegram accounts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/telegram_link.py

      - name: Send user alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/user_alerts.py

      - name: Commit offset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/telegram_offset.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: telegram offset [auto]"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort; git pull --rebase=true -X theirs origin main; }
            sleep 2
          done
          exit 1
