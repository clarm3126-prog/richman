name: Fetch Prices

on:
  schedule:
    # ⚠️ 예전에는 `*/5 0-7` 로 5분마다 걸어 뒀는데 **실제로는 하루 2~4회만 돌았다.**
    #    (9월 한 달 기록: 09-15 두 번, 09-16 네 번. 나머지 구십여 번은 깃허브가 버린다)
    #    고빈도 예약은 무료 러너에서 거의 다 떨어진다. 그래서 시각을 박아 둔다.
    #    시각을 명시하면 대체로 돈다. 대신 몇 십 분 늦게 도는 날이 있다.
    #
    # ⚠️ **같은 워크플로의 슬롯은 두 시간 이상 벌린다.** 두 시간 안에 붙여 두면
    #    둘 중 하나만 뜬다. 12317 이 실행 간격을 재서 찾았고, 나도 커밋 기록으로
    #    확인했다(fetch-prices 실측 최소 간격 290분, user-alerts 97분).
    #    처음엔 14:50 을 넣었는데 15:35 와 45분 간격이라 둘 중 하나가 버려진다. 뺐다.
    #
    # 장중 (UTC = KST - 9)
    - cron: "10 0 * * 1-5"    # KST 09:10  개장 직후
    - cron: "10 2 * * 1-5"    # KST 11:10
    - cron: "10 4 * * 1-5"    # KST 13:10
    # 정규장 마감 확정 — 정규장은 15:30 에 끝난다 (13:10 과 145분)
    - cron: "35 6 * * 1-5"    # KST 15:35
    # 애프터마켓 반영 — 2026-09-14 부터 시간외가 16~20시 실시간으로 바뀌었다
    - cron: "5 11 * * 1-5"    # KST 20:05
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch market data
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/fetch_prices.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: update market data [auto]"
          # Retry up to 3 times with rebase. -X theirs: data files are last-writer-wins.
          for i in 1 2 3; do
            if git push; then
              echo "Push succeeded on attempt $i"
              exit 0
            fi
            echo "Push attempt $i failed, fetching and rebasing..."
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort; git pull --rebase=true -X theirs origin main; }
            sleep 2
          done
          echo "Failed to push after 3 attempts"
          exit 1
