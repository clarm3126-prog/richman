# 매매 기록 카드의 재료.
#
# scripts/make_trade_cards.py 가 이걸 읽어 차트가 들어간 카드를 만든다.
# 시세는 네이버에서 받아오므로 여기엔 날짜만 적으면 된다.
#
# ⚠️ buy/sell 은 **실제 매수·매도한 날**이다. 지금 적힌 값은 주가 흐름에서
#    뽑아낸 임시값이라, 실제 날짜로 바꿔야 한다. 금액은 적지 않는다 —
#    카드에도 퍼센트만 나온다.
#
#   from/to  차트에 보여줄 구간 (매수 앞뒤로 넉넉히)
#   buy/sell YYYYMMDD. 휴장일이면 다음 거래일로 맞춰 찍힌다

trades:
  - file: trade-taesung.jpg
    name: 태성
    code: "323280"
    from: "20240401"
    to: "20241220"
    buy: "20240503"      # TODO 실제 매수일
    sell: "20240612"     # TODO 실제 매도일
    headline: ["태성", "팔고 나서 더 갔습니다"]
    sections:
      - heading: 매수
        body: 저점에서 긴 횡보 뒤 거래량이 터졌다. 매집 구간이라고 봤다.
      - heading: 매도
        body: 오른 뒤 힘이 빠졌다고 보고, 더 좋아 보이는 종목으로 갈아타려고 팔았다.
      - heading: 무엇이 문제였나
        body: 조정에도 거래량이 실리지 않았다. 추세가 깨진 게 아니라 내가 못 기다린 것이다.

  # 아래 넷은 날짜를 넣어야 만들어진다. buy/sell 이 비어 있으면 건너뛴다.
  # 문구는 기존 카드(scripts/make_blog_cards.py)에서 옮겨 온 것이다.

