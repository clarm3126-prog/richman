# 매매 기록 카드의 재료.
#
# scripts/make_trade_cards.py 가 이걸 읽어 차트가 들어간 카드를 만든다.
# 시세는 네이버에서 받아오므로 여기엔 날짜와 체결가만 적으면 된다.
#
# 날짜와 가격은 증권사 주문내역 캡처(assets/새 폴더)에서 옮겨 적고,
# 그날의 저가~고가 안에 드는지 시세로 다시 맞춰 본 값이다.
#
#   from/to     차트에 보여줄 구간
#   buy/sell    YYYYMMDD
#   buy_price   평균 매수 단가. 여러 번 나눠 샀으면 가중평균
#   sell_price  평균 매도 단가
#
# 금액은 카드에 안 나온다. 퍼센트와 보유 일수만 나온다.

trades:
  # 주문내역: 2024-01-19 500주 @4,350 / 2024-02-20 130주 @4,200 매수
  #           2024-06-13 630주 @11,540 매도. 평균 매수 4,319원 → +167%.
  #
  # 구간을 2026년까지 넓혔다. 2024-11 에서 끊으면 "팔고 나서 280%" 까지만
  # 보이는데, 실제 이야기는 그 뒤가 더 길다.
  #   2026-04-27 고가 94,000원  판 값의 8.15배 (+715%)
  #   2026-09-18 종가 45,250원  그 고점에서 -51.9%
  #
  # 끝까지 들고 있었어야 했다는 이야기가 아니다. 안 파는 것도 답이
  # 아니었다는 것이 요점이다.
  - file: trade-taesung.jpg
    name: 태성
    code: "323280"
    from: "20231201"
    to: "20260919"
    buy: "20240119"
    sell: "20240613"
    buy_price: 4319
    sell_price: 11540
    headline: ["태성", "팔고 나서 8배"]
    sections:
      - heading: 매수
        body: 저점에서 긴 횡보 뒤 거래량이 터졌다. 매집 구간이라고 봤다.
      - heading: 매도
        body: 167% 오른 뒤 힘이 빠졌다고 보고, 더 좋아 보이는 종목으로 갈아타려고 팔았다.
      - heading: 그 뒤
        body: 판 값의 8배까지 갔다. 그런데 그 자리도 지금은 반 토막이다. 안 파는 것도 답은 아니었다.

  # 주문내역: 2026-04-23 1,478주 @8,140 매수
  #           2026-05-04 739주 @18,000 + 739주 @17,000 매도 (평균 17,500)
  # +115%. 판 뒤 2026-05-06 고가 20,300원(+16%)에서 꺾였다.
  - file: trade-daewon.jpg
    name: 대원전선
    code: "006340"
    from: "20260201"
    to: "20260731"
    buy: "20260423"
    sell: "20260504"
    buy_price: 8140
    sell_price: 17500
    headline: ["대원전선", "11일 만에 정리"]
    sections:
      - heading: 매수
        body: 1년 횡보 뒤 거래량 실린 신고가 돌파. 전력 케이블 교체 주기와 데이터센터 증설이 겹치는 자리였다.
      - heading: 매도
        body: 투자경고 지정. 과매수 구간이었고 경고 종목은 며칠 안에 급락하는 경우가 많았다.
      - heading: 그 뒤
        body: 이틀 더 올라 고점을 찍고 꺾였다. 계획대로 나온 매매다.
