      - heading: 매도
        body: 지루한 횡보 중에 주변의 코인 수익을 보고 청산했다.
      - heading: 무엇이 문제였나
        body: 판 뒤로 더 올랐다. 매도 버튼을 누르게 한 건 차트가 아니라 남의 수익률이었다.

