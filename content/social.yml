# 쓰레드 / 인스타그램 자동 운영 설정
#
# 이 파일은 공개 저장소에 그대로 올라갑니다.
# 토큰이나 비밀번호는 절대 여기 적지 말고 GitHub Secrets에 넣으세요.
#
# 문구 안에서 쓸 수 있는 자리표시자:
#   {user}  댓글 단 사람 (@아이디)
#   {link}  아래 link.url
#   {brand} 아래 link.label
# 문구를 목록으로 여러 개 적으면 그중 하나를 무작위로 고릅니다.

link:
  url: "https://clarm3126-prog.github.io/richman/"
  label: "종목노트"

# ---------------------------------------------------------------
# 자동 글쓰기
# ---------------------------------------------------------------
post:
  enabled: true
  platforms: [threads, instagram]

  # 하루에 올릴 수 있는 최대 글 수 (플랫폼 합산 1건 = 1회 실행)
  max_per_day: 1

  # 자동 생성 글 종류를 날짜에 따라 돌려가며 사용
  # screener = 미너비니 조건 통과, momentum = 거래량 돌파, theme = 상승 테마
  rotation: [screener, momentum, theme]

  # 본문에 링크를 붙일지.
  # false면 링크 대신 아래 cta로 댓글을 유도하고,
  # 댓글이 달리면 답글(쓰레드)이나 DM(인스타)으로 링크를 보냅니다.
  append_link: false

  # 글 마지막에 붙는 댓글 유도 문구.
  # 여기서 지정한 단어가 아래 engage.rules의 키워드와 맞아야
  # 댓글이 확실하게 규칙에 걸립니다. 문구를 바꾸면 키워드도 같이 바꾸세요.
  cta: "종목노트로 매매일지 써보고 싶으시면 댓글에 '노트'라고 남겨주세요. 링크 보내드릴게요."

  # 인스타 캐러셀 2번째 장에 고정으로 붙는 소개 카드.
  # 매일 바뀌는 종목 카드가 1번째, 이 카드가 2번째로 올라갑니다.
  # 여기 내용을 고치면 다음 발행 때 카드가 새로 그려집니다.
  # about_card를 통째로 지우면 소개 카드 없이 1장만 올라갑니다.
  about_card:
    title: "이 계정은"
    sections:
      - heading: "매일 뭘 올리나"
        body: "장 마감 후 국내 전 종목을 훑어서 추세·거래량·실적 조건에 걸린 것만 추려 올립니다. 사람이 고르는 게 아니라 매일 같은 기준으로 자동 계산합니다."
      - heading: "종목노트로 할 수 있는 것"
        body: "관심 종목에 목표가를 걸어두면 도달할 때 텔레그램으로 알려드립니다. 보유 종목은 손절선과 트레일링 매도 시그널까지 옵니다. 매매일지도 같이 씁니다."
      - heading: "쓰는 법"
        body: "구글 로그인 한 번이면 끝입니다. 전부 무료이고 결제 화면이 없습니다."
    footer: "종목 추천이 아닙니다. 조건에 걸린 목록이고 판단은 각자 하셔야 합니다."

  # 인스타 캡션 끝에 붙일 해시태그
  hashtags:
    - "#주식"
    - "#국내주식"
    - "#주식공부"
    - "#미너비니"
    - "#차트분석"
    - "#종목노트"

# ---------------------------------------------------------------
# 댓글 대응
# ---------------------------------------------------------------
engage:
  enabled: true

  # 최근 며칠 안에 올린 글의 댓글만 확인
  lookback_days: 7

  # 한 번 실행에 처리할 최대 댓글 수 (레이트리밋 보호)
  max_actions_per_run: 20

  # 이 단어가 들어간 댓글에는 아무 반응도 하지 않습니다.
  # 시비·홍보성 댓글에 자동 답장이 나가는 사고를 막는 안전장치입니다.
  skip_keywords:
    - "사기"
    - "리딩"
    - "리딩방"
    - "손해"
    - "환불"
    - "고소"
    - "신고"
    - "광고"
    - "디엠주세요"
    - "팔로우맞팔"

  # 위에서부터 먼저 걸리는 규칙 하나만 적용됩니다.
  # reply_threads / reply_instagram 로 플랫폼별 문구를 따로 줄 수 있습니다.
  # dm 은 인스타에서만 동작합니다 (쓰레드에는 DM API가 없음).
  rules:
    - name: link_request
      # 앞의 post.cta가 "댓글에 '노트'"를 요청하므로 노트가 첫 번째입니다.
      # 안내대로 안 쓰는 사람이 훨씬 많으니 나머지 표현도 넉넉히 열어둡니다.
      keywords: ["노트", "링크", "주소", "url", "사이트", "어디서", "어디에서",
                 "어플", "앱", "받는곳", "무료인가요",
                 "저요", "나도", "저도", "신청", "궁금", "받고싶", "받아보", "보내주"]
      reply_threads:
        - "{user} 여기예요 → {link} 조건 통과 종목이랑 차트 전부 무료로 보실 수 있어요."
        - "{user} {link} 에서 보시면 됩니다. 로그인 없이도 목록은 다 열려요."
      reply_instagram:
        - "{user} 방금 DM으로 링크 보내드렸어요."
        - "{user} DM 확인해 주세요. 링크 보내드렸습니다."
      # DM이 안 나갔을 때 대신 쓰는 문구 (DM 권한 문제나 7일 경과)
      reply_fallback:
        - "{user} 프로필 링크에 있어요! {link}"
      dm:
        - "안녕하세요! 댓글 주셔서 링크 보내드려요.\n\n{brand} → {link}\n\n오늘 조건에 걸린 종목 목록이랑 차트, 매매일지까지 전부 무료로 쓰실 수 있어요. 궁금한 거 있으시면 편하게 물어보세요."

    - name: alert_question
      keywords: ["알림", "텔레그램", "텔레", "푸시", "알려주", "notification"]
      reply_threads:
        - "{user} 관심종목에 목표가만 걸어두면 도달했을 때 텔레그램으로 알려드려요. {link}"
      reply_instagram:
        - "{user} 알림 설정 방법 DM으로 보내드렸어요!"
      reply_fallback:
        - "{user} 로그인하고 ⭐ 관심 탭에서 목표가만 걸어두시면 돼요. {link}"
      dm:
        - "알림은 이렇게 쓰시면 돼요.\n\n1. {link} 접속 후 구글 로그인\n2. ⭐ 관심 탭에서 종목 추가하고 목표가 입력\n3. 📱 알림 버튼 눌러서 나온 6자리 코드를 텔레그램 봇에 전송\n\n그러면 목표가 도달할 때랑 보유 종목에 매도 시그널이 뜰 때 텔레그램으로 알려드립니다."

    - name: how_it_works
      keywords: ["어떻게", "기준", "조건", "무슨기준", "어떤기준", "미너비니", "왜이종목", "근거"]
      reply:
        - "{user} 미너비니 추세 템플릿(이평선 정배열, 52주 고점 근처)에 실적 조건까지 붙여서 매일 자동으로 거릅니다. 조건별 통과 여부는 {link} 에서 종목별로 다 보여요."
        - "{user} 추세·수급·실적 세 축으로 점수를 매겨요. 어떤 조건에 걸렸는지 종목마다 표시되니까 {link} 에서 직접 보시는 게 빠릅니다."

    - name: price_question
      keywords: ["유료", "얼마", "가격", "결제", "돈내", "비용", "구독료"]
      reply:
        - "{user} 전부 무료예요. 결제 없습니다. {link}"

    - name: thanks
      keywords: ["감사", "고마", "잘보", "잘봤", "유익", "도움됐", "좋은정보", "굿", "최고"]
      reply:
        - "{user} 감사합니다! 매일 장 마감 후에 올리고 있어요."
        - "{user} 도움 되셨다니 다행이에요. 내일도 올릴게요!"

  # 위 규칙에 아무것도 안 걸린 댓글의 기본 동작.
  #
  # 주의: 모든 댓글에 똑같은 답장이 나가면 플랫폼이 스팸으로 볼 수 있습니다.
  # 문구를 여러 개 두어 돌려쓰게 했지만, 부담되면 reply를 지워 비워두세요.
  # 비워두면 규칙에 안 걸린 댓글에는 아무 반응도 하지 않습니다.
  default:
    reply:
      - "{user} 읽어주셔서 감사합니다!"
      - "{user} 봐주셔서 고맙습니다 🙏"
      - "{user} 댓글 감사해요!"
    dm: null
