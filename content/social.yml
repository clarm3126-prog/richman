# 쓰레드 / 인스타그램 자동 운영 설정
#
# 이 파일은 공개 저장소에 그대로 올라갑니다.
# 토큰이나 비밀번호는 절대 여기 적지 말고 GitHub Secrets에 넣으세요.
#
# 문구 안에서 쓸 수 있는 자리표시자:
#   {user}  댓글 단 사람 (@아이디)
#   {link}  아래 link.url
#   {brand} 아래 link.label
# 문구를 목록으로 여러 개 적으면 그중 하나를 무작위로 고릅니다.

link:
  url: "https://stage2.kr/"
  label: "종목노트"
  # 유입원 꼬리표. 링크 끝에 ?from=threads 처럼 붙어서
  # 사이트가 "어디서 들어온 사람인지"를 셀 수 있게 합니다.
  # 쓰레드·인스타는 앱 안 브라우저로 열려 referrer가 안 남는 경우가 많아
  # 이 꼬리표가 없으면 구분이 안 됩니다.
  # 비워두면 꼬리표 없이 주소만 나갑니다.
  source_param: "from"

# ---------------------------------------------------------------
# 자동 글쓰기
# ---------------------------------------------------------------
post:
  enabled: true
  platforms: [threads, instagram]

  # 하루에 올릴 수 있는 최대 글 수 (플랫폼 합산 1건 = 1회 실행)
  #
  # 2인 이유: 워크플로가 하루 두 번 돈다. 19:00은 --auto로 스크리너 글을,
  # 21:00은 --queue-only로 수동 큐 글을 올린다. 큐가 비면 21:00 실행이
  # 그냥 넘어가므로 자연히 하루 1건으로 돌아간다.
  max_per_day: 2

  # 자동 생성 글 종류를 날짜에 따라 돌려가며 사용
  # screener = 미너비니 조건 통과, momentum = 거래량 돌파, theme = 상승 테마
  rotation: [screener, momentum, theme]

  # 본문에 링크를 붙일지.
  # false면 링크 대신 아래 cta로 댓글을 유도하고,
  # 댓글이 달리면 답글(쓰레드)이나 DM(인스타)으로 링크를 보냅니다.
  append_link: false

  # 글 마지막에 붙는 댓글 유도 문구.
  # 여기서 지정한 단어가 아래 engage.rules의 키워드와 맞아야
  # 댓글이 확실하게 규칙에 걸립니다. 문구를 바꾸면 키워드도 같이 바꾸세요.
  cta: "종목노트로 매매일지 써보고 싶으시면 댓글에 '노트'라고 남겨주세요. 링크 보내드릴게요."

  # 인스타 캐러셀 2번째 장에 고정으로 붙는 소개 카드.
  # 매일 바뀌는 종목 카드가 1번째, 이 카드가 2번째로 올라갑니다.
  # 여기 내용을 고치면 다음 발행 때 카드가 새로 그려집니다.
  # about_card를 통째로 지우면 소개 카드 없이 1장만 올라갑니다.
  about_card:
    # headline은 카드 맨 위에 큰 글씨로 들어갑니다 (두 줄 권장).
    headline: ["종목노트가", "하는 일"]
    sections:
      - heading: "매일 뭘 올리나"
        body: "장 마감 후 국내 전 종목을 훑습니다. 이미 오르기 시작했는지, 거래량이 늘었는지, 실적이 좋아지는지를 봅니다. 사람이 고르지 않고 매일 자동 계산합니다."
      - heading: "종목노트로 할 수 있는 것"
        body: "관심 종목에 목표가를 걸어두면 도달할 때 텔레그램으로 알려드립니다. 보유 종목은 얼마에 손절할지, 언제 팔지도 알려드립니다. 매매일지도 같이 씁니다."
      - heading: "쓰는 법"
        body: "구글 로그인 한 번이면 끝입니다. 전부 무료이고 결제 화면이 없습니다."
    footer: "종목 추천이 아닙니다. 조건에 걸린 목록이고 판단은 각자 하셔야 합니다."

  # 인스타 캡션 끝에 붙일 해시태그
  hashtags:
    - "#주식"
    - "#국내주식"
    - "#주식공부"
    - "#미너비니"
    - "#차트분석"
    - "#종목노트"

# ---------------------------------------------------------------
# 댓글 달 만한 글 추리기
# ---------------------------------------------------------------
# 남의 글에 자동으로 댓글을 달지 않습니다. 고른 글을 텔레그램으로 보내고
# 댓글은 사람이 직접 답니다. 자동 참여는 플랫폼이 금지하고 계정이 정지됩니다.
#
# 쓰레드 키워드 검색은 Meta 앱 심사(threads_keyword_search)를 통과하기
# 전까지 내 글만 돌려줍니다. 권한이 없어도 오류가 안 나고 조용히 범위만
# 좁아져서, 남의 글이 하나도 없으면 텔레그램으로 그 사실을 알립니다.
digest:
  enabled: true

  # 하루에 보낼 글 수. 많이 보내봐야 다 못 답니다.
  # 직접 단 댓글 다섯 개가 자동 댓글 쉰 개보다 팔로워로 이어집니다.
  max_items: 6

  # 검색할 키워드. 하나당 질의 1회이고 하루 2,200건까지 됩니다.
  keywords:
    - "손절"
    - "매매일지"
    - "주식공부"
    - "국내주식"
    - "코스닥"
    - "신고가"
    - "종목분석"
    - "물타기"

  # 이 말이 들어간 글은 아예 뺍니다. 거기 댓글을 달면 같은 부류로 읽힙니다.
  skip_keywords:
    - "리딩방"
    - "오픈카톡"
    - "오픈채팅"
    - "수익인증"
    - "무료체험"
    - "급등주"
    - "비법"
    - "정회원"
    - "입장료"
    - "디엠주세요"
    - "dm주세요"

  # 이보다 짧은 글은 뺍니다. 할 말을 보탤 건더기가 없습니다.
  min_text_length: 40

  # 이보다 오래된 글은 뺍니다. 지난 글에 댓글을 달면 아무도 안 봅니다.
  max_age_hours: 36

# ---------------------------------------------------------------
# 댓글 대응
# ---------------------------------------------------------------
engage:
  enabled: true

  # 최근 며칠 안에 올린 글의 댓글만 확인
  lookback_days: 7

  # 한 번 실행에 처리할 최대 댓글 수 (레이트리밋 보호)
  max_actions_per_run: 20

  # 이 단어가 들어간 댓글에는 아무 반응도 하지 않습니다.
  # 시비·홍보성 댓글에 자동 답장이 나가는 사고를 막는 안전장치입니다.
  skip_keywords:
    - "사기"
    - "리딩"
    - "리딩방"
    - "손해"
    - "환불"
    - "고소"
    - "신고"
    - "광고"
    - "디엠주세요"
    - "팔로우맞팔"

  # 위에서부터 먼저 걸리는 규칙 하나만 적용됩니다.
  # reply_threads / reply_instagram 로 플랫폼별 문구를 따로 줄 수 있습니다.
  # dm 은 인스타에서만 동작합니다 (쓰레드에는 DM API가 없음).
  rules:
    - name: link_request
      # 앞의 post.cta가 "댓글에 '노트'"를 요청하므로 노트가 첫 번째입니다.
      # 안내대로 안 쓰는 사람이 많아 다른 표현도 열어두되, 링크를 달라는
      # 뜻이 분명한 말만 넣습니다.
      #
      # "저요", "나도", "저도", "궁금"은 뺐습니다. 글 끝에 의견을 묻는
      # 질문을 넣으면서부터 "저도 그랬어요" 같은 답글이 들어오는데,
      # 이 단어들이 있으면 링크를 안 물어본 사람에게 "디엠 드릴게요"가
      # 나갑니다. 쓰레드는 DM을 직접 보내야 해서 헛일까지 늘어납니다.
      keywords: ["노트", "링크", "주소", "url", "사이트", "어디서", "어디에서",
                 "어플", "앱", "받는곳", "무료인가요",
                 "신청", "받고싶", "받아보", "보내주"]
      reply_threads:
        - "{user} 디엠으로 링크 보내드릴게요!"
        - "{user} 확인하고 디엠 드릴게요 :)"
        - "{user} 디엠 보내드릴게요. 잠시만요!"
      reply_instagram:
        - "{user} 방금 DM으로 링크 보내드렸어요."
        - "{user} DM 확인해 주세요. 링크 보내드렸습니다."
      # DM이 안 나갔을 때 대신 쓰는 문구 (DM 권한 문제나 7일 경과)
      reply_fallback:
        - "{user} 프로필 링크에 있어요! {link}"
      dm:
        - "안녕하세요! 댓글 주셔서 링크 보내드려요.\n\n{brand} → {link}\n\n오늘 조건에 걸린 종목 목록이랑 차트, 매매일지까지 전부 무료로 쓰실 수 있어요. 궁금한 거 있으시면 편하게 물어보세요."

    - name: alert_question
      keywords: ["알림", "텔레그램", "텔레", "푸시", "알려주", "notification"]
      reply_threads:
        - "{user} 관심종목에 목표가만 걸어두면 도달할 때 텔레그램으로 알려드려요. 방법은 디엠으로 보내드릴게요!"
      reply_instagram:
        - "{user} 알림 설정 방법 DM으로 보내드렸어요!"
      reply_fallback:
        - "{user} 로그인하고 ⭐ 관심 탭에서 목표가만 걸어두시면 돼요. {link}"
      dm:
        - "알림은 이렇게 쓰시면 돼요.\n\n1. {link} 접속 후 구글 로그인\n2. ⭐ 관심 탭에서 종목 추가하고 목표가 입력\n3. 📱 알림 버튼 눌러서 나온 6자리 코드를 텔레그램 봇에 전송\n\n그러면 목표가에 닿았을 때랑, 보유 종목을 팔 때가 됐을 때 텔레그램으로 알려드립니다."

    - name: how_it_works
      keywords: ["어떻게", "기준", "조건", "무슨기준", "어떤기준", "미너비니", "왜이종목", "근거"]
      reply:
        - "{user} 이미 오르기 시작한 종목만 봅니다. 이동평균선이 차례로 정렬됐는지, 52주 최고가 근처인지, 실적이 좋아지고 있는지를 매일 자동으로 따져요. 종목마다 어떤 조건을 통과했는지 다 보여드립니다."
        - "{user} 오르는 흐름인지, 거래량이 붙었는지, 실적이 좋아지는지 세 가지로 점수를 매겨요. 사람이 고르는 게 아니라 매일 같은 기준으로 자동 계산합니다."

    - name: price_question
      keywords: ["유료", "얼마", "가격", "결제", "돈내", "비용", "구독료"]
      reply:
        - "{user} 전부 무료예요. 결제 화면이 아예 없습니다."

    - name: thanks
      keywords: ["감사", "고마", "잘보", "잘봤", "유익", "도움됐", "좋은정보", "굿", "최고"]
      reply:
        - "{user} 감사합니다! 매일 장 마감 후에 올리고 있어요."
        - "{user} 도움 되셨다니 다행이에요. 내일도 올릴게요!"

  # 위 규칙에 아무것도 안 걸린 댓글의 기본 동작.
  #
  # 주의: 모든 댓글에 똑같은 답장이 나가면 플랫폼이 스팸으로 볼 수 있습니다.
  # 문구를 여러 개 두어 돌려쓰게 했지만, 부담되면 reply를 지워 비워두세요.
  # 비워두면 규칙에 안 걸린 댓글에는 아무 반응도 하지 않습니다.
  default:
    reply:
      - "{user} 읽어주셔서 감사합니다!"
      - "{user} 봐주셔서 고맙습니다 🙏"
      - "{user} 댓글 감사해요!"
    dm: null
