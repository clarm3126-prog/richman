      1. 살 때 팔 자리까지 정한다
      2. 계획에서 벗어나면 즉시 판다
      3. 벗어나지 않았으면 안 판다
      4. 남이 아니라 내 시나리오를 본다

      3번이 제일 어렵습니다.
      제가 판 매매는 전부
      추세가 깨져서가 아니라 지루해서였으니까요.

