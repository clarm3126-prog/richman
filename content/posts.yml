    kind: lesson
    platforms: [threads]
    published: false
    text: |-
      이미 오른 테마를 쫓으면
      늦습니다.

      자금흐름 탭은
      지금 오른 곳이 아니라
      옮겨가는 중인 곳을 봅니다.

      테마마다 현재 순위와
      순위 변동을 나란히 둡니다.

      변동이 핵심입니다.

      5위에서 3위로 올라온 테마와
      1위에 계속 있는 테마는
      전혀 다릅니다.

      앞쪽이 지금 돈이
      들어오는 중인 테마입니다.

      다음 주 강세 예상도 나오는데
      예상 정확도를 같이 띄웁니다.
      낮으면 낮은 대로 보여줍니다.

      맞히는 게 아니라
      세는 일이라서요.

      테마는 어떻게 고르시나요?
      링크가 필요하시면 '노트'라고 적어주세요.

  # docs/블로그글/06_테마별_탭_보는_법.txt 기준.
  - after: "2026-09-24"
    kind: lesson
    platforms: [threads]
    published: false
    text: |-
      테마를 260개 넘게 다룹니다.

      그중 최근 강세로 돌아선 테마가
      어느 날은 20개였습니다.

      보는 순서가 있습니다.

      1. 강세로 돌아선 테마를 고른다
      2. 그 안의 종목 목록을 본다
      3. 미너비니·모멘텀 탭에서
         다시 확인한다

      3번을 빼면 안 됩니다.

      테마가 좋아도
      그 안에서 조건을 통과하는 종목과
      아닌 종목이 갈립니다.

      테마는 어디를 볼지
      좁혀주는 역할입니다.
      사도 된다는 뜻이 아닙니다.

      테마 분류는 네이버 기준입니다.
      회사가 스스로 정한 게 아닙니다.

      요즘 눈여겨보는 테마가 있으신가요?
      링크가 필요하시면 '노트'라고 적어주세요.

  # docs/블로그글/10_거래량_탭_보는_법.txt 기준.
