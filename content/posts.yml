      2025년 1월에 쓴 매매 복기입니다. 종목 추천이 아닙니다.

      매물대에 막혔을 때 여러분은 파시나요, 기다리시나요?

      종목노트로 매매일지 써보고 싶으시면 댓글에 '노트'라고 남겨주세요. 링크 보내드릴게요.

  - after: "2026-09-11"
    kind: trade_log
    platforms: [threads, instagram]
    image:
      - assets/cards/blog-pskholdings.jpg
      - assets/cards/about.jpg
    published: false
    text: |-
      피에스케이홀딩스(031980), 아직 들고 있습니다

      앞서 올린 태성·에스오에스랩·리가켐바이오는 전부 제가 못 기다려서 놓친 매매입니다. 하나씩 적어놓고 나서야 문제가 보였습니다. 추세가 깨져서 판 적은 한 번도 없었습니다. 지루함이거나 남의 수익률이었습니다.

      이번엔 살 때 정한 기준대로 들고 있습니다.

      · 삼성·하이닉스에 납품하는 반도체 장비주
      · 전 고점 돌파 후 신고가 갱신
      · 3년 연속 당기순이익 큰 폭 증가, R&D 투자도 매년 증가
      · 기관 수급 비중 상승
      · 증권사 목표가 88,000원 상향

      지금까지 안정적인 수익권입니다. 종목 보는 눈이 달라진 게 아니라 파는 기준이 달라졌습니다.

      2026년 2월 매수 후 보유 중입니다. 종목 추천이 아닙니다.

      여러분은 파는 기준을 정해두셨나요? 어떤 기준인지 궁금합니다.

      종목노트로 매매일지 써보고 싶으시면 댓글에 '노트'라고 남겨주세요. 링크 보내드릴게요.

