    kind: lesson
    platforms: [threads]
    published: false
    text: |-
      거래량이 늘었다고
      다 좋은 게 아닙니다.

      값이 빠지면서 거래량이 늘면
      파는 사람이 몰린 겁니다.

      오를 때 늘어야 합니다.

      거래량 탭은
      평소보다 크게 늘어난 종목을
      몇 배인지로 줄 세웁니다.

      달력도 같이 있습니다.
      날짜별로 급증 종목이 쌓입니다.

      여기서 볼 건 하나입니다.
      같은 종목이 며칠째
      올라오고 있는가.

      하루만 터진 것과
      이어서 들어오는 것은
      전혀 다릅니다.

      급증 뒤 되밀리는 일도 잦습니다.
      등락률과 같이 보세요.

      거래량이 터지면 들어가시나요?
      링크가 필요하시면 '노트'라고 적어주세요.

  # docs/블로그글/12_미국주식_탭_보는_법.txt 기준.
  - after: "2026-09-24"
    kind: lesson
    platforms: [threads]
    published: false
    text: |-
      같은 조건을 미국에도 겁니다.

      S&P500과 나스닥100 종목만 봅니다.
      미국 전체가 아닙니다.

      조건은 미너비니 탭과 같습니다.
      추세, 실적, 살 자리.
      칩 이름도 같아서
      국내 탭을 보셨으면
      바로 읽으실 수 있습니다.

      다른 점은 세 가지입니다.

      · 미국장이 끝난 뒤 계산해서
        국내 탭보다 늦게 갱신됩니다
      · 환율은 반영하지 않습니다
      · 실적 자료 출처가 달라
        일부 숫자가 비어 있습니다

      국내가 약할 때
      같은 눈으로 밖을 보려고
      만들어 둔 탭입니다.

      국내와 미국, 어느 쪽을 보고 계신가요?
      링크가 필요하시면 '노트'라고 적어주세요.

  # 계정의 자리를 한 편으로 말하는 글. '직장인은 매일 시장을 볼 수 없다'가
  # 이 계정의 전제다.
  - after: "2026-09-24"
    kind: lesson
    platforms: [threads, instagram]
    image:
      - assets/cards/about.jpg
      - assets/cards/promo-what.jpg
    published: false
    text: |-
      직장인은 매일 시장을
      볼 수 없습니다.

      9시에 회의가 있고
      장 끝날 때쯤 보고가 있습니다.

      저는 그래서 졌습니다.
      쉬는 시간에 호가창을 켜고
      남들 말을 주워담았습니다.

      볼 수 없다는 걸 인정하고
      방식을 바꿨습니다.

      장 끝난 뒤에 계산합니다.
      전 종목을 같은 기준으로 훑고
      걸린 것만 남깁니다.

      파는 기준은 사기 전에 정합니다.
      정해두면 장중에
      생각하지 않아도 됩니다.

      하루에 보는 시간은
      저녁 10분입니다.

      장중에 시장을 보실 수 있으신가요?
      링크가 필요하시면 '노트'라고 적어주세요.

  # 못 하는 것을 먼저 말하는 글. 무료 도구를 의심하는 사람에게 가장 잘 먹히는 형식이다.
