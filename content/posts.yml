# 직접 쓴 글 대기열.
#
# 여기 글이 있으면 자동 생성보다 먼저 발행됩니다.
# 발행된 글은 published: true 로 표시되어 다시 올라가지 않습니다.
#
# 항목 형식:
#   - text: 본문 (쓰레드 500자, 인스타 캡션 2200자 제한)
#     image: assets/cards/파일명.png   (선택. 인스타에 올리려면 필수)
#     platforms: [threads, instagram]  (선택. 없으면 설정의 기본값)
#     after: "2026-09-10"              (선택. 이 날짜 이후에만 발행)
#     kind: promo                      (선택. 성과 요약에서 형식을 가르는 이름)
#     threads_image: true              (선택. image의 첫 장을 쓰레드에도 붙인다)
#     published: false
#
# kind는 아무 이름이나 되지만, 같은 형식끼리 같은 이름을 써야
# 성과 요약에서 '어떤 형식이 댓글을 받았나'가 나옵니다.
# 지금 쓰는 이름: promo(무료 배포) / trade_log(매매 기록) / lesson(정리·원칙)
#
# 아래 항목은 네이버 블로그(blog.naver.com/clelrl3126)에 쓴 매매 기록을
# 종목 하나씩 옮긴 것입니다.
#
# after 날짜가 전부 같습니다. 한 번 실행에 한 편씩 나가므로, 위에서부터
# 순서대로 평일 하루에 한 편씩 올라갑니다. 날짜를 따로 주고 싶으면
# 항목마다 after를 다르게 적으면 됩니다.
#
# 스크리너 자동 글은 19:00, 이 대기열 글은 21:00에 나갑니다. 대기열이
# 비면 21:00 실행이 그냥 넘어가서 다시 하루 1건으로 돌아갑니다.
#
# 쓰레드는 본문 그대로, 인스타는 요약 카드 + 소개 카드 2장짜리 캐러셀로
# 나갑니다. 카드는 scripts/make_blog_cards.py 로 미리 만들어 커밋해 뒀고,
# 문구를 고치려면 그 파일을 수정하고 다시 실행하면 됩니다.

queue:
  # 무료 배포글. 성장 엔진 역할이라 대기열 맨 앞에 둔다.
  # 카드는 scripts/make_promo_cards.py 로 만든 밝은 배경 2장을 쓴다.
  - after: "2026-09-10"
    kind: promo
    platforms: [threads, instagram]
    image:
      - assets/cards/promo-what.jpg
      - assets/cards/promo-list.jpg
    # 2026-09-11과 09-12에 두 번 나갔다. queue_done이 기록되지 않던 탓에
    # 같은 글이 이틀 연속 올라갔다. 세 번째로 나가지 않게 여기서 닫는다.
    published: true
    text: |-
      종목 코드만 넣으면 지금이 살 자리인지 재주는 걸 만들었습니다. 무료로 풉니다.

      미너비니 8개 조건 중 몇 개를 통과했는지
      52주 고점 대비 지금 어디쯤인지
      손절선을 어디에 둬야 하는지까지 계산해서 보여줍니다.

      목표가에 닿으면 텔레그램으로 알림이 오고, 매매일지도 같이 씁니다.

      제가 쓰려고 만든 거라 결제 화면이 아예 없습니다.
      종목 추천은 하지 않습니다. 조건에 걸렸는지만 보여줍니다.

      댓글에 '노트'라고 남겨주세요. 링크 디엠으로 보내드릴게요.
      (팔로우해두시면 요청함으로 안 가고 바로 도착합니다)

  # 주말에 손으로 누르는 두 편. 정해진 시각 발행은 평일뿐이지만
  # Actions에서 "대기열 글 (posts.yml)"로 직접 돌리면 요일과 무관하게 나간다.
  # 한 번 실행에 한 편이므로 토·일 각각 한 번씩 누르면 된다.
  #
  # 연결 안내를 먼저 둔다. "방금 고쳤습니다"가 들어가는 글이라 묵힐수록
  # 값이 떨어지고, 연결을 해야 알림이 오므로 순서로도 이쪽이 앞이다.
  #
  # 둘 다 카드가 본문을 그대로 담고 있어서 threads_image를 켠다. 사진만
  # 봐도 내용이 끝나는 글이라 본문이 접혀도 손해가 없다.
  - after: "2026-09-12"
    kind: guide
    platforms: [threads, instagram]
    threads_image: true
    image:
      - assets/cards/telegram-guide.jpg
      - assets/cards/about.jpg
    published: false
    text: |-
      텔레그램 알림 연결이 안 된다는 말씀을 받았습니다. 제 잘못이었어요. 안내 문구에 봇 이름이 빠져 있었습니다. 방금 고쳤습니다.

      이제 이렇게 하시면 됩니다.

      1. 사이트에서 구글 로그인 (오른쪽 위 👤 버튼)
      2. ⭐ 관심 탭 → 📱 알림 버튼
      3. 확인을 누르면 코드가 복사되고 봇 대화창이 열립니다
      4. 봇 화면 아래 [시작] 버튼을 누르세요
      5. 복사된 코드를 붙여넣어 보내면 끝

      4번에서 제일 많이 막히십니다. 시작 버튼을 안 누르면 봇이 메시지를 아예 못 받습니다.

      연결 확인까지 최대 5분 걸립니다. 바로 안 온다고 코드를 다시 보내지 않으셔도 돼요.

      그리고 종목에 목표가를 걸어두셔야 알림이 옵니다. 손절 알림은 매입가를 넣은 종목에만 가고요.

      안 되시면 댓글 남겨주세요. 같이 봐드리겠습니다.

  - after: "2026-09-12"
    kind: guide
    platforms: [threads, instagram]
    threads_image: true
    image:
      - assets/cards/alert-rules.jpg
      - assets/cards/about.jpg
    published: false
    text: |-
      "손절은 어떻게 표시가 되나요?" 받은 질문입니다.

      화면에 선이 그려지는 게 아니라 텔레그램으로 옵니다. 이렇게요.

      🔴 손절선 도달 (-7.3%)
      매입가 12,000원 → 현재 11,120원

      세 가지가 자동으로 걸립니다.
      · 매입가에서 -7% 닿으면 손절 알림
      · +20% 넘긴 뒤 21일선을 깨면 매도 신호
      · +50% 넘긴 뒤 50일선을 깨면 매도 신호

      한 가지만 기억하시면 됩니다. 관심 종목에 매입가를 넣으셔야 이게 다 동작합니다. 화면에 '선택사항'이라고 적혀 있어서 그냥 넘기시는 분이 많은데, 안 넣으면 손절 알림이 아예 안 옵니다.

      목표가 알림은 매입가 없이도 옵니다. 손절과 트레일링만 매입가가 필요해요.

      댓글에 '노트'라고 남겨주세요. 링크 디엠으로 보내드릴게요.

  # 무료 배포글 변형. 뼈대(문제 → 만든 것 → 계산해주는 것 3줄 → 결제 화면
  # 없음 → 종목 추천 아님 → 댓글 CTA)는 그대로 두고 앞부분 문제 제기만 바꾼다.
  # 같은 글을 그대로 다시 올리면 이미 링크를 받은 사람이 댓글을 안 달아
  # 회차마다 댓글률이 떨어진다. 도달은 댓글로 나오므로 그 형식 자체가 죽는다.
  #
  # after 날짜로 자리를 잡아둔다. pick_from_queue가 after가 아직 안 된 항목은
  # 건너뛰고 다음 것을 집으므로, 위에 둬도 그날까지는 매매 기록이 나간다.
  #
  # CTA 단어는 '노트'로 고정한다. social.yml의 link_request 규칙이 이 단어에
  # 묶여 있고, '손절' 같은 흔한 말로 바꾸면 링크를 안 물어본 댓글에까지
  # 디엠이 나간다 (쓰레드는 디엠을 손으로 보내야 해서 헛일이 그대로 늘어난다).
  # 관심 종목 조건 확인 기능을 알리는 글.
  #
  # 이 기능이 다른 스크리너와 갈리는 지점이다. 보통은 순위 상위 몇 개만
  # 보여주는데, 조건 요약 파일이 평가한 전 종목을 담고 있어서 순위 밖
  # 종목도 조건별로 나온다. "내가 이미 들고 있는 종목"을 넣어볼 수 있다는
  # 뜻이고, 남의 종목 목록보다 자기 종목이 먼저 궁금한 게 자연스럽다.
  #
  # 인스타를 뺐다. 지금 인스타는 9편에 조회 23으로 도달이 없는데 카드를
  # 두 장 그려 붙이는 비용은 그대로 든다. 카드를 만들면 그때 넣는다.
  - after: "2026-09-16"
    kind: promo
    platforms: [threads]
    published: false
    text: |-
      갖고 계신 종목이 지금 어느 자리인지 재드립니다.

      관심 목록에 종목을 담으면, 그 종목이 미너비니 추세 조건 여덟 가지 중 몇 개를 통과했는지 하나씩 보여줍니다.

      · 50일·150일·200일선 위에 있나
      · 이동평균선이 순서대로 정렬됐나
      · 200일선이 오르고 있나
      · 52주 고점에서 25% 안쪽인가
      · 시장 전체보다 강한가

      순위권 밖 종목도 됩니다. 매일 4,000개가 넘는 전 종목을 계산해두기 때문입니다.

      통과 개수가 적다고 나쁜 종목이라는 뜻은 아닙니다. 지금 오름세 구간에 있느냐만 봅니다. 종목 추천은 하지 않습니다.

      무료이고 결제 화면이 없습니다.

      댓글에 '노트'라고 남겨주세요. 링크 디엠으로 보내드릴게요.
      (팔로우해두시면 요청함으로 안 가고 바로 도착합니다)

  - after: "2026-09-18"
    kind: promo
    platforms: [threads, instagram]
    image:
      - assets/cards/promo-list.jpg
      - assets/cards/about.jpg
    published: false
    text: |-
      계좌를 깎아먹은 건 종목 선택이 아니었습니다. 손절선을 안 정해두고 산 거였습니다.

      사고 나서 정하려니 못 정하겠더라고요. 이미 물려 있으면 파는 게 지는 것 같아서요.

      그래서 살 때 자동으로 정해지게 만들었습니다. 무료로 풉니다.

      매입가에서 -7% 닿으면 손절 알림
      +20% 넘어가면 21일선 따라 올리는 매도 신호
      +50%부터는 50일선 기준으로

      전부 텔레그램으로 옵니다. 제가 쓰려고 만든 거라 결제 화면이 아예 없습니다.
      종목 추천은 하지 않습니다. 조건에 걸렸는지만 보여줍니다.

      댓글에 '노트'라고 남겨주세요. 링크 디엠으로 보내드릴게요.
      (팔로우해두시면 요청함으로 안 가고 바로 도착합니다)

  # 백테스트 변형. 불리한 숫자를 먼저 까는 글이라 신뢰 축과 성장 축을 같이 먹는다.
  # 숫자는 data/backtest_stats.json의 minervini_strong 30d 집계 그대로다.
  # 평균은 이제 쓴다. 증자 보정 버그를 고쳤고(backtest.py), 지수 대비와 손절
  # 적용본을 같이 내게 해서 숫자가 혼자 뜨지 않기 때문이다.
  #
  # "888번"이라고 쓰지 않는다. 조건에 걸린 종목은 며칠씩 계속 걸려 있어서
  # 888건은 종목 77개를 다시 센 값이다. 독립 시행처럼 읽히면 찔린다.
  #
  # 숫자는 data/backtest_stats.json의 minervini_strong 30d에서 온다.
  # 백테스트를 다시 돌려 값이 바뀌면 이 글과 promo-backtest.jpg를 같이 고칠 것.
  - after: "2026-09-22"
    kind: promo
    platforms: [threads, instagram]
    image:
      - assets/cards/promo-backtest.jpg
      - assets/cards/promo-list.jpg
    published: false
    text: |-
      제가 만든 조건표가 얼마나 맞는지 돌려봤습니다. 지수보다 못했습니다.

      조건에 걸린 날 사서 30거래일 그냥 들고 있었을 때 평균 -15.2%.
      같은 기간 코스피가 -10.9%였습니다. 조건만 보고 사서 버티면 시장보다 못했다는 뜻입니다.

      그런데 -7%에 자르고 오르면 이동평균을 따라 올리는, 제가 안내하는 대로 했을 때는 평균 -6.7%였습니다. 제일 크게 깨진 한 건도 -60.9%에서 -22.9%로 줄고요.

      승률은 오히려 떨어집니다. 20.5%에서 13.9%로요. 자주 잘리니까요. 대신 크게 깨지지 않습니다.

      종목 77개를 넉 달 돌린 숫자입니다. 하필 코스피가 8,800에서 6,300까지 빠진 구간이었고요. 전부 사이트에 그대로 공개해뒀습니다.

      댓글에 '노트'라고 남겨주세요. 링크 디엠으로 보내드릴게요.
      (팔로우해두시면 요청함으로 안 가고 바로 도착합니다)

  # 조건을 그대로 까는 글. 무료 배포글과 달리 "받아가세요"가 아니라
  # "이렇게 계산합니다"가 본론이라 kind는 lesson으로 둔다. promo 통계에
  # 섞이면 무료 배포 형식의 댓글률이 흐려진다.
  #
  # 문구는 scripts/screener.py 를 보고 맞췄다. 8개는 trend_template이고
  # 52주 저점 +25%와 거래대금 70억은 setup이라 8개에 넣지 않는다 — 여기서
  # 숫자가 어긋나면 화면과 다르다는 소리를 바로 듣는다.
  #
  # 백테스트 글(09-22) 하루 전에 둔다. 조건을 먼저 보여주고 다음 날
  # "그래도 이것만으로는 안 된다"가 나가는 순서가 자연스럽다.
  - after: "2026-09-21"
    kind: lesson
    platforms: [threads, instagram]
    image:
      - assets/cards/minervini-trend.jpg
      - assets/cards/minervini-filter.jpg
    published: false
    text: |-
      미너비니 탭이 종목을 어떻게 거르는지 공개합니다.

      추세 8개입니다.
      · 현재가가 50일선, 150일선, 200일선 위에 있을 것
      · 50일선 > 150일선 > 200일선으로 정배열일 것
      · 200일선이 한 달 전보다 올라와 있을 것
      · 52주 고점에서 25% 넘게 빠지지 않았을 것
      · 시장 대비 강도가 전 종목 상위 30%일 것

      8개를 다 통과하면 strict, 6개 이상에 실적이 붙으면 strong입니다. 대부분 여기서 떨어집니다.

      조건을 보기 전에 빼는 것도 있습니다. 관리종목, 상장 6개월 미만, ETF·스팩·우선주, 시총 1000억 미만인데 5일 만에 50% 오른 종목. 마지막이 작전주 필터입니다.

      실적은 DART에서 직접 받습니다. 분기 순이익 작년 대비 +25%, 매출 +15%, 3년 평균 영업이익률 20% 이상.

      사람이 고르지 않고 매일 같은 기준으로 자동 계산합니다. 종목 추천은 하지 않습니다.

      댓글에 '노트'라고 남겨주세요. 링크 디엠으로 보내드릴게요.

  - after: "2026-09-11"
    kind: trade_log
    platforms: [threads, instagram]
    image:
      - assets/cards/blog-daewon.jpg
      - assets/cards/about.jpg
    published: false
