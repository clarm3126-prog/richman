      제 매매가 깨진 자리는 늘 같았습니다

      지금까지 올린 실패들을 모아보니 원인이 하나였습니다. 뉴스, 종토방, 유튜브, 주변 사람. 밖을 보다가 제 시나리오가 무너졌고 그 자리에 욕심이 들어왔습니다.

      그래서 네 가지로 정리했습니다.

      1. 살 때 팔 자리까지 정한다
      2. 계획에서 벗어나면 즉시 판다
      3. 벗어나지 않았으면 안 판다
      4. 남이 아니라 내 시나리오를 본다

      3번이 제일 어렵습니다. 제가 판 매매는 전부 추세가 깨져서가 아니라 지루해서였으니까요.

