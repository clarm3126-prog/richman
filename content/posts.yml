      맨 위에 '최근 강세 전환 테마'.
      광통신 ▲165, 유리 기판 ▲160처럼
      테마 순위가 몇 계단 뛰었는지예요.
      돈이 어디로 도는지 먼저 봅니다.

      종목 카드에는 신호가 붙습니다.
      · 200일선 2일전 돌파
      · 변동폭 줄어듦
      · 거래량 5.55배
      · 매수 자리 돌파 · 저점 높아짐

      그 밑에 자금흐름과 실적 가속.

      미너비니 탭이 이미 가는 종목이면
      이쪽은 막 방향을 튼 종목입니다.

      과거 검증 숫자도 같이 띄웁니다.
      좋게 나오지 않았어요.
      그래서 손절선이 붙어 있습니다.

      200일선을 막 뚫으면 들어가시나요?
