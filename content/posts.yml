      받은 질문인데, 아닙니다. 두 탭은 서로 독립입니다. 각각 전 종목을 따로 훑습니다.

      보는 자리가 다릅니다.

      미너비니 탭은 이미 추세가 만들어진 종목입니다. 50·150·200일선 위에 정배열로 올라서 있고 52주 고점에서 25% 안쪽인, 한창 가는 중인 자리요.

      모멘텀 탭은 그 전 단계입니다. 200일선을 최근에 막 뚫은 종목을 찾습니다. 거기에 변동폭이 줄어드는 모양, 거래량 증가, 직전 20일 고점 돌파, 저점을 높여가는 흐름이 몇 개나 붙었는지 봅니다.

      그래서 둘은 잘 안 겹칩니다. 200일선을 이제 넘은 종목은 아직 정배열이 아니고 고점에서도 눌려 있으니까요. 어쩌다 둘 다 걸리면 '합류'로 따로 표시됩니다. 드뭅니다.

      같은 종목을 다르게 보는 게 아니라, 다른 시점을 보는 겁니다.

      댓글에 '노트'라고 남겨주세요. 링크 디엠으로 보내드릴게요.

