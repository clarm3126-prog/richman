    text: |-
      이 도구가 못 하는 걸
      적어두겠습니다.

      앞을 못 맞힙니다.
      지나간 값을 세는 것뿐입니다.

      제 조건표를 907건 돌렸을 때
      이긴 비율은 21.2%였습니다.
      같은 기간 지수보다 나빴습니다.

      테마 분류는 네이버 기준이라
      회사가 정한 게 아닙니다.

      미국 탭은 실적 자료 출처가 달라
      일부 숫자가 비어 있습니다.

      다음 주 예상에는
      정확도를 같이 띄웁니다.
      낮으면 낮은 대로 보여줍니다.

      할 수 있는 건 하나입니다.
      전 종목을 매일 같은 기준으로
      빠짐없이 세는 것.

      고르는 건 사람 몫입니다.

      이 중 어느 것이 제일 걸리시나요?
      링크가 필요하시면 '노트'라고 적어주세요.
