# 직접 쓴 글 대기열.
#
# 여기 글이 있으면 자동 생성보다 먼저 발행됩니다.
# 발행된 글은 published: true 로 표시되어 다시 올라가지 않습니다.
#
# 항목 형식:
#   - text: 본문 (쓰레드 500자, 인스타 캡션 2200자 제한)
#     image: assets/cards/파일명.png   (선택. 인스타에 올리려면 필수)
#     platforms: [threads, instagram]  (선택. 없으면 설정의 기본값)
#     after: "2026-09-10"              (선택. 이 날짜 이후에만 발행)
#     kind: promo                      (선택. 성과 요약에서 형식을 가르는 이름)
#     threads_image: true              (선택. image의 첫 장을 쓰레드에도 붙인다)
#     published: false
#
# kind는 아무 이름이나 되지만, 같은 형식끼리 같은 이름을 써야
# 성과 요약에서 '어떤 형식이 댓글을 받았나'가 나옵니다.
# 지금 쓰는 이름: promo(무료 배포) / trade_log(매매 기록) / lesson(정리·원칙)
#
# 아래 항목은 네이버 블로그(blog.naver.com/jongmoknote)에 쓴 매매 기록을
# 종목 하나씩 옮긴 것입니다.
#
# after 날짜가 전부 같습니다. 한 번 실행에 한 편씩 나가므로, 위에서부터
# 순서대로 평일 하루에 한 편씩 올라갑니다. 날짜를 따로 주고 싶으면
# 항목마다 after를 다르게 적으면 됩니다.
#
# 스크리너 자동 글은 19:00, 이 대기열 글은 21:00에 나갑니다. 대기열이
# 비면 21:00 실행이 그냥 넘어가서 다시 하루 1건으로 돌아갑니다.
#
# 쓰레드는 본문 그대로, 인스타는 요약 카드 + 소개 카드 2장짜리 캐러셀로
# 나갑니다. 카드는 scripts/make_blog_cards.py 로 미리 만들어 커밋해 뒀고,
# 문구를 고치려면 그 파일을 수정하고 다시 실행하면 됩니다.

queue:
  # 무료 배포글. 성장 엔진 역할이라 대기열 맨 앞에 둔다.
  # 카드는 scripts/make_promo_cards.py 로 만든 밝은 배경 2장을 쓴다.
  - after: "2026-09-10"
    kind: promo
    platforms: [threads, instagram]
    image:
      - assets/cards/promo-what.jpg
      - assets/cards/promo-list.jpg
    # 2026-09-11과 09-12에 두 번 나갔다. queue_done이 기록되지 않던 탓에
    # 같은 글이 이틀 연속 올라갔다. 세 번째로 나가지 않게 여기서 닫는다.
    published: true
    text: |-
      종목 코드만 넣으면 지금이 살 자리인지 재주는 걸 만들었습니다. 무료로 풉니다.

      미너비니 8개 조건 중 몇 개를 통과했는지
      52주 고점 대비 지금 어디쯤인지
      손절선을 어디에 둬야 하는지까지 계산해서 보여줍니다.

      목표가에 닿으면 텔레그램으로 알림이 오고, 매매일지도 같이 씁니다.

      제가 쓰려고 만든 거라 결제 화면이 아예 없습니다.
      종목 추천은 하지 않습니다. 조건에 걸렸는지만 보여줍니다.

      댓글에 '노트'라고 남겨주세요. 링크 디엠으로 보내드릴게요.
      (팔로우해두시면 요청함으로 안 가고 바로 도착합니다)

  # 주말에 손으로 누르는 두 편. 정해진 시각 발행은 평일뿐이지만
  # Actions에서 "대기열 글 (posts.yml)"로 직접 돌리면 요일과 무관하게 나간다.
  # 한 번 실행에 한 편이므로 토·일 각각 한 번씩 누르면 된다.
  #
  # 연결 안내를 먼저 둔다. "방금 고쳤습니다"가 들어가는 글이라 묵힐수록
  # 값이 떨어지고, 연결을 해야 알림이 오므로 순서로도 이쪽이 앞이다.
  #
  # 둘 다 카드가 본문을 그대로 담고 있어서 threads_image를 켠다. 사진만
  # 봐도 내용이 끝나는 글이라 본문이 접혀도 손해가 없다.
  # 2026-09-13 21:00 에 나갔다. queue_done 은 본문 해시로 발행 여부를 재는데,
  # 그 뒤 본문을 글쓰기 규칙에 맞춰 다시 쓰면서 해시가 바뀌어 버렸다.
  # 큐가 이 글을 다시 안 올린 글로 보고 집는다. published 로 못 박는다.
  #
  # 교훈: 이미 나간 큐 글의 본문은 고치지 않는다. 고쳐야 하면 여기서
  # published: true 로 닫고 새 항목을 만든다.
  - after: "2026-09-12"
    kind: guide
    platforms: [threads, instagram]
    threads_image: true
    image:
      - assets/cards/telegram-guide.jpg
      - assets/cards/about.jpg
    published: true
    text: |-
      텔레그램 알림이
      안 온다는 말씀을 받았습니다.

      제 잘못이었어요.
      안내에 봇 이름이 빠졌습니다.
      방금 고쳤습니다.

      1. 사이트에서 구글 로그인
      2. ⭐ 관심 탭 → 📱 알림
      3. 확인 누르면 대화창이 열려요
      4. 봇 화면 아래 [시작] 누르기
      5. 코드를 붙여넣어 보내면 끝

      4번에서 제일 많이 막히십니다.
      시작을 안 누르면
      봇이 메시지를 못 받습니다.

      확인까지 최대 5분 걸려요.
      안 온다고 코드를
      다시 보내지 않으셔도 됩니다.

      목표가를 걸어두셔야 알림이 와요.
      손절 알림은 매입가를 넣은
      종목에만 갑니다.

      안 되시면 댓글 남겨주세요.

  # 블로그 「미너비니 8가지 조건, 국내에선 여덟 번째를 바꿔야 합니다」(09-16)와 짝.
  # 숫자는 screener.py 로 확인했다. calc_rs_raw 가 3개월 40% + 6·9·12개월
  # 각 20% 가중으로 지수 대비 초과 수익률을 내고, apply_rs_percentile 이
  # 전 종목을 줄 세워 백분위를 매긴다. 70 이상이 통과이고 오늘은
  # 684종목 중 205개였다.
  #
  # 맞는 카드가 없어 쓰레드만. 만들면 인스타도 켠다.
  - after: "2026-09-18"
    kind: lesson
    platforms: [threads]
    published: false
    text: |-
      미너비니 조건 여덟 개 중
      일곱 개는 그대로 됩니다.

      여덟 번째만 국내에 없습니다.

      앞의 일곱은 이동평균선 위치와
      고점까지의 거리입니다.
      종목 하나만 봐도 나옵니다.

      여덟 번째는 등수입니다.
      전 종목을 다 계산한 뒤에야
      내가 몇 등인지 알 수 있습니다.

      원래 미국에서 매기는 점수인데
      국내엔 그게 없습니다.

      그래서 직접 셉니다.
      지수보다 얼마나 더 올랐는지를
      3·6·9·12개월로 재고
      684종목을 줄 세웁니다.

      상위 30%만 통과입니다.
      어느 날은 205개였습니다.

      여러분은 조건을 몇 개까지 보시나요?
      링크가 필요하시면 '노트'라고 적어주세요.

  # 블로그 「교대근무 주식, 루틴이 안 되면 뭘 정해야 하나」(09-16)와 짝.
  # 이미 있는 "직장인은 매일 시장을 볼 수 없습니다"와 겹쳐 보이지만
  # 다른 글이다. 그쪽은 시간이 없다는 이야기이고, 이쪽은 시간이 매번
  # 다르다는 이야기다. 일반 직장인에게는 퇴근 후 30분이라도 고정으로
  # 남지만 교대근무는 그 자리가 없다. 여기가 이 계정이 남과 갈리는
  # 자리라, 둘을 붙여 두지 않고 날짜를 벌려 둔다.
  - after: "2026-09-19"
    kind: lesson
    platforms: [threads]
    published: false
    text: |-
      저는 교대근무를 합니다.
      어제는 장을 봤는데 오늘은 못 봅니다.
      그게 몇 년째입니다.

      장을 못 보는 게 문제가 아닙니다.
      매번 다른 시간에 보는 게 문제입니다.

      일반 직장인은 못 봐도
      퇴근 후 30분이 남습니다.
      그 30분이 쌓여 습관이 됩니다.

      제 30분은 어떤 날은 새벽 3시고
      어떤 날은 오후 2시입니다.
      습관이 붙을 자리가 없습니다.

      장전 브리핑은 그 시간에 자고,
      리딩방은 남의 시간에
      저를 맞추라고 합니다.

      데이터는 제가 새벽 3시에 보든
      오후 2시에 보든
      같은 자리에 있습니다.

      근무 시간이 바뀌는 일 하시는 분 계신가요?
      링크가 필요하시면 '노트'라고 적어주세요.

  # 실제로 받은 질문에서 나온 글. 09-15에 방침을 만든 날 썼고 시의성이 있어
  # 큐 앞쪽에 끼운다. CTA를 뺀 것은 이 글이 권하는 글이 아니라 답하는 글이기 때문이다.
  - after: "2026-09-16"
    kind: lesson
    platforms: [threads, instagram]
    image:
      - assets/cards/promo-what.jpg
      - assets/cards/about.jpg
    published: false
    text: |-
      어제 이런 질문을 받았습니다.

      "직접 만드신 서비스인가요?
      구글 로그인이 있어서
      운영 주체랑 개인정보 처리부터
      확인해보고 쓸게요."

      맞는 말이었습니다.
      개인정보처리방침이 없었습니다.

      만들어서 올렸습니다.
      사이트 맨 아래에 있습니다.

      구글 로그인은
      이메일과 이름만 받습니다.
      저장하는 건 관심 종목,
      매매일지, 알림 연결뿐입니다.

      방문 집계에
      IP나 기기 정보는 안 남깁니다.
      데이터는 서울에 있습니다.

      종목 목록은 로그인 없이도
      전부 보실 수 있습니다.

      의심이 아니라 제대로 보신 겁니다.
      덕분에 고쳤습니다.

  - after: "2026-09-12"
    kind: guide
    platforms: [threads, instagram]
    threads_image: true
    image:
      - assets/cards/alert-rules.jpg
      - assets/cards/about.jpg
    published: true
    text: |-
      "손절은 어떻게 표시되나요?"
      받은 질문입니다.

      화면에 선이 그려지는 게 아니라
      텔레그램으로 옵니다.

      🔴 손절선 도달 (-7.3%)
      매입가 12,000원 → 현재 11,120원

      세 가지가 자동으로 걸립니다.
      · -7% 닿으면 손절 알림
      · +20% 뒤 20일선 깨면 매도
      · +50% 뒤 50일선 깨면 매도

      하나만 기억하시면 됩니다.
      관심 종목에 매입가를
      넣으셔야 다 동작합니다.

      '선택사항'이라 적혀 있어서
      그냥 넘기시는 분이 많은데,
      안 넣으면 손절 알림이 안 옵니다.

      목표가 알림은
      매입가 없이도 옵니다.

      댓글에 '노트'라고 남겨주세요.
      링크 디엠으로 보내드릴게요.

  # 무료 배포글 변형. 뼈대(문제 → 만든 것 → 계산해주는 것 3줄 → 결제 화면
  # 없음 → 종목 추천 아님 → 댓글 CTA)는 그대로 두고 앞부분 문제 제기만 바꾼다.
  # 같은 글을 그대로 다시 올리면 이미 링크를 받은 사람이 댓글을 안 달아
  # 회차마다 댓글률이 떨어진다. 도달은 댓글로 나오므로 그 형식 자체가 죽는다.
  #
  # after 날짜로 자리를 잡아둔다. pick_from_queue가 after가 아직 안 된 항목은
  # 건너뛰고 다음 것을 집으므로, 위에 둬도 그날까지는 매매 기록이 나간다.
  #
  # CTA 단어는 '노트'로 고정한다. social.yml의 link_request 규칙이 이 단어에
  # 묶여 있고, '손절' 같은 흔한 말로 바꾸면 링크를 안 물어본 댓글에까지
  # 디엠이 나간다 (쓰레드는 디엠을 손으로 보내야 해서 헛일이 그대로 늘어난다).
  # 관심 종목 조건 확인 기능을 알리는 글.
  #
  # 이 기능이 다른 스크리너와 갈리는 지점이다. 보통은 순위 상위 몇 개만
  # 보여주는데, 조건 요약 파일이 평가한 전 종목을 담고 있어서 순위 밖
  # 종목도 조건별로 나온다. "내가 이미 들고 있는 종목"을 넣어볼 수 있다는
  # 뜻이고, 남의 종목 목록보다 자기 종목이 먼저 궁금한 게 자연스럽다.
  #
  # 인스타를 뺐다. 지금 인스타는 9편에 조회 23으로 도달이 없는데 카드를
  # 두 장 그려 붙이는 비용은 그대로 든다. 카드를 만들면 그때 넣는다.
  - after: "2026-09-16"
    kind: promo
    platforms: [threads]
    published: false
    text: |-
      갖고 계신 종목의 자리를 재드립니다.

      관심 목록에 담으면
      미너비니 추세 조건 여덟 개 중
      몇 개를 통과했는지 보여줍니다.

      · 50·150·200일선 위에 있나
      · 이동평균선이 정배열인가
      · 200일선이 오르고 있나
      · 고점에서 25% 안쪽인가
      · 시장 전체보다 강한가

      순위권 밖 종목도 됩니다.
      화면엔 상위 200개만 뜨지만
      계산은 800여 개를 매일 합니다.

      통과 개수가 적다고 나쁜 건 아닙니다.
      지금 오름세 구간이냐만 봅니다.
      종목 추천은 하지 않습니다.

      무료이고 결제 화면이 없습니다.

      지금 들고 계신 종목은 어디쯤인가요?
      링크가 필요하시면 '노트'라고 적어주세요.
      (팔로우하시면 바로 도착합니다)

  - after: "2026-09-18"
    kind: promo
    platforms: [threads, instagram]
    image:
      - assets/cards/promo-list.jpg
      - assets/cards/about.jpg
    published: false
    text: |-
      계좌를 깎아먹은 건
      종목 선택이 아니었습니다.
      손절선을 안 정하고 산 거였죠.

      사고 나서 정하려니
      못 정하겠더라고요.
      물려 있으면 파는 게
      지는 것 같아서요.

      그래서 살 때 자동으로
      정해지게 만들었습니다.
      무료로 풉니다.

      · -7% 닿으면 손절 알림
      · +20%부터 20일선 따라 올림
      · +50%부터는 50일선 기준

      전부 텔레그램으로 옵니다.
      제가 쓰려고 만든 거라
      결제 화면이 아예 없습니다.
      종목 추천은 하지 않습니다.

      계좌를 깎은 건 어느 쪽이었나요?
      링크가 필요하시면 '노트'라고 적어주세요.
